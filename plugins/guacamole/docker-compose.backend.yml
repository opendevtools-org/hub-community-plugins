# Apache Guacamole for Hub (community plugin).
# Upstream: https://guacamole.apache.org/
# Image: flcontainers/guacamole — web UI + guacd + PostgreSQL in one container.
# Prebuilt linux/amd64 + linux/arm64. No local build.
# Default login: guacadmin / guacadmin (change immediately).
#
# PostgreSQL lives under /config. Use a Docker named volume (not a host bind
# mount): bind mounts on Docker Desktop for Windows often leave the client
# stuck on "Guacamole client waiting for DB".

services:
  guacamole:
    image: flcontainers/guacamole:${GUACAMOLE_TAG:-latest}
    pull_policy: always
    container_name: homelab-guacamole
    restart: unless-stopped
    ports:
      - "${GUACAMOLE_PORT:-8080}:8080"
    volumes:
      - guacamole-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:127.0.0.1"
    environment:
      TZ: ${TZ:-UTC}
      # Optional: comma-separated Guacamole extensions (no spaces), e.g. auth-totp
      # EXTENSIONS: ${GUACAMOLE_EXTENSIONS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 8
      start_period: 90s

volumes:
  guacamole-config:
    driver: local
