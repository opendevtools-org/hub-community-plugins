<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VibraVid client</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
    main { max-width: 28rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { line-height: 1.45; opacity: 0.85; }
    a { font-weight: 600; }
    code { font-size: 0.9em; }
  </style>
</head>
<body>
  <main>
    <h1>VibraVid web client</h1>
    <p>This container is the device client. It reverse-proxies the backend set in <code>VIBRAVID_API_UPSTREAM</code>.</p>
    <p><a href="/">Open VibraVid</a></p>
  </main>
</body>
</html>
