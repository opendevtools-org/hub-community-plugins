# Stremio for Home Lab Hub (community plugin).
# Upstream app: https://www.stremio.com/
# Image: tsaridas/stremio-docker — web player + streaming server on one port.
# No local build. Use only with content you have rights to.

services:
  stremio:
    image: tsaridas/stremio-docker:${STREMIO_TAG:-latest}
    pull_policy: always
    container_name: homelab-stremio
    restart: unless-stopped
    ports:
      - "${STREMIO_PORT:-8080}:8080"
    volumes:
      - ${STREMIO_DATA_DIR:-./data/stremio}:/root/.stremio-server
    environment:
      NO_CORS: "1"
      AUTO_SERVER_URL: "1"
      CASTING_DISABLED: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s
